[project]
name = "nonebot-napcat-smart-reply"
version = "0.1.0"
description = "NoneBot2 + NapCat QQ intelligent auto-reply bot with short-term memory."
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "nonebot2[fastapi]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.nonebot]
plugins = ["src.plugins.smart_reply"]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
builtin_plugins = []

[tool.ruff]
line-length = 100
target-version = "py310"

